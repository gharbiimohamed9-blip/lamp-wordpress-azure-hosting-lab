# /etc/apache2/sites-available/monsite.conf  (HTTP, port 80)
# Certbot génère ensuite monsite-le-ssl.conf et ajoute la redirection vers HTTPS.
<VirtualHost *:80>
    ServerName monsite-gharbi.francecentral.cloudapp.azure.com
    DocumentRoot /var/www/monsite

    <Directory /var/www/monsite>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/monsite_error.log
    CustomLog ${APACHE_LOG_DIR}/monsite_access.log combined
</VirtualHost>
