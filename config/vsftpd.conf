# /etc/vsftpd.conf : FTPS (FTP + TLS), compte client isolé, mode passif derrière le NAT Azure
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
connect_from_port_20=YES

# Enfermer l'utilisateur dans son dossier (chroot)
chroot_local_user=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Seuls les utilisateurs listés dans /etc/vsftpd.userlist peuvent se connecter
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Mode passif : indispensable derrière le NAT d'Azure
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=IP_PUBLIQUE
pasv_addr_resolve=NO

# TLS obligatoire (certificat Let's Encrypt réutilisé)
ssl_enable=YES
rsa_cert_file=/etc/letsencrypt/live/monsite-gharbi.francecentral.cloudapp.azure.com/fullchain.pem
rsa_private_key_file=/etc/letsencrypt/live/monsite-gharbi.francecentral.cloudapp.azure.com/privkey.pem
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=NO
ssl_tlsv1_1=NO
ssl_tlsv1_2=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH
